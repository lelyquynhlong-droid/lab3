<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bai9</title>
</head>
<body>
    <h2>Bai 9: Quay thưởng may mắn</h2>
    <button onclick="quayThuong()">Quay thưởng</button>
    <p id="ketqua"></p>
    <script>
        function quayThuong() {
            let phanQua = ["Iphone", "Samsung Galaxy", "Laptop", "Tai nghe", "Smartwatch"];
            let phanQuaNgauNhien = phanQua[Math.floor(Math.random() * phanQua.length)];
            let ketQua = "Chúc mừng! Bạn đã trúng phần thưởng: " + phanQuaNgauNhien;
            document.getElementById("ketqua").innerHTML = ketQua;
        }
    </script>
</body>
</html>
