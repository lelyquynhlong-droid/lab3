<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bai3</title>
</head>
<body>
    <h2>Bai 3: Xep hoc luc</h2>
    <label for="">Nhap vao diem: </label>
    <input type="number" id="diem" placeholder="hay nhap diem trung binh cua ban (0-100)">
    <br><br>
    <button onclick="xepHocLuc()">Xep loai</button>
    <p id="ketqua"></p>
    <script>
        function xepHocLuc(){
            let diem = document.getElementById("diem").value;
            let loai;
            if (diem >= 90){
                loai = "A";
            }
            else if (diem >= 80){
                loai = "B";
            }
            else if (diem >= 70){
                loai = "C";
            }
            else if (diem >= 60){
                loai = "D";
            }
            else{
                loai = "F";
            }
            document.getElementById("ketqua").innerHTML = "Diem cua ban la: " + diem + "<br>Loai hoc luc cua ban la: " + loai;
        }
    </script>
</body>
</html>
